    <div class="typing-container">
        <span id="typed-text"></span>
        
    </div>
    <div class="tagline-container">
        <p class="tagline">Your Journey, Our Expertise.</p>
        <button id="get-started-btn">GET STARTED</button>
    </div>
    
    <script >document.addEventListener("DOMContentLoaded", function () {
        const phrases = [
        "EMBARK ON A JOURNEY OF A LIFETIME",
"DISCOVER HIDDEN GEMS AROUND THE WORLD",
"CREATE MEMORIES THAT LAST FOREVER",
"FIND YOUR ADVENTURE IN EVERY DESTINATION",
"EXPERIENCE THE BEAUTY OF DIVERSE CULTURES",
"ESCAPE TO BREATHTAKING LANDSCAPES",
"LET YOUR WANDERLUST GUIDE YOU"
        ];
    
        const typedText = document.getElementById('typed-text');
        let phraseIndex = 0;
    
        function type() {
            const currentPhrase = phrases[phraseIndex];
            let charIndex = 0;
    
            const typingInterval = setInterval(() => {
                typedText.textContent += currentPhrase[charIndex];
                charIndex++;
    
                if (charIndex === currentPhrase.length) {
                    clearInterval(typingInterval);
                    setTimeout(erase, 2000);
                }
            }, 100);
        }
    
        function erase() {
            const currentPhrase = phrases[phraseIndex];
            let charIndex = currentPhrase.length - 1;
    
            const erasingInterval = setInterval(() => {
                typedText.textContent = currentPhrase.substring(0, charIndex);
                charIndex--;
    
                if (charIndex < 0) {
                    clearInterval(erasingInterval);
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    setTimeout(type, 1000);
                }
            }, 50);
        }
    
        setTimeout(type, 1000);
    });
    document.getElementById("get-started-btn").addEventListener("click", function () {
            window.location.href = "choice page.html";
          });
    </script>
